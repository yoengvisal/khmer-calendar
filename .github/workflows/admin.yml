name: admin
on:
  pull_request:
    paths: ['khmer-calendar-admin/**', '.github/workflows/admin.yml']
  push:
    branches: [main]
    paths: ['khmer-calendar-admin/**']
defaults:
  run:
    working-directory: khmer-calendar-admin
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: khmer-calendar-admin/.nvmrc
          cache: npm
          cache-dependency-path: khmer-calendar-admin/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build:staging
      - run: npm run build
