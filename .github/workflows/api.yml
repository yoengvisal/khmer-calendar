name: api
on:
  pull_request:
    paths: ['khmer-calendar-api/**', 'shared/**', '.github/workflows/api.yml']
  push:
    branches: [main]
    paths: ['khmer-calendar-api/**', 'shared/**']
defaults:
  run:
    working-directory: khmer-calendar-api
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: khmer_calendar_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U ci" --health-interval 5s --health-retries 10
    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://ci:ci@localhost:5432/khmer_calendar_test
      JWT_ACCESS_SECRET: ci-only-secret-ci-only-secret-ci-only-secret
      CORS_ORIGINS: http://localhost:5173
      LOG_FORMAT: json
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: khmer-calendar-api/.nvmrc
          cache: npm
          cache-dependency-path: khmer-calendar-api/package-lock.json
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npx prisma migrate deploy
      - run: npm run test:e2e
      - run: npm run build
